[package]
name = "zpm-switch"
version = "6.0.0-rc.20"
edition = "2021"

[[bin]]
name = "yarn"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
clipanion = { workspace = true, features = ["serde"] }
regex = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["hickory-dns"] }
rkyv = { workspace = true, features = ["bytecheck"] }
serde_json = { workspace = true }
serde_plain = { workspace = true }
serde_with = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
open = { workspace = true }
uuid = { version = "1.21.0", features = ["v4"] }
zpm-allocator = { workspace = true }
serde_yaml = { workspace = true }
zpm-formats = { workspace = true }
zpm-macro-enum = { workspace = true }
zpm-parsers = { workspace = true }
zpm-semver = { workspace = true }
zpm-utils = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_arch = "wasm64", target_vendor = "browserpod"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["default-tls"] }

[target.'cfg(not(all(target_arch = "wasm64", target_vendor = "browserpod")))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true, default-features = false, features = ["diff"] }
