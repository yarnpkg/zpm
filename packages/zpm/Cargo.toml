[package]
name = "zpm"
edition = "2024"

[[bin]]
name = "yarn-bin"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true}
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
clipanion = { workspace = true, features = ["serde", "tokens"] }
colored = { workspace = true }
dialoguer = { workspace = true }
futures = { workspace = true }
git-url-parse = { workspace = true }
globset = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
itertools = { workspace = true }
notify = { workspace = true }
open = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
pubgrub = { workspace = true }
version-ranges = { workspace = true }
rayon = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck"] }
pep-508 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["gzip", "http2", "hickory-dns"] }
regex = { workspace = true }
rust-ini = { workspace = true }
serde_with = { workspace = true }
serde_yaml = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
wax = { workspace = true }
zpm-allocator = { workspace = true }
zpm-config = { workspace = true }
zpm-formats = { workspace = true }
zpm-git = { workspace = true }
zpm-macro-enum = { workspace = true }
zpm-parsers = { workspace = true }
zpm-primitives = { workspace = true }
zpm-semver = { workspace = true }
zpm-switch = { workspace = true }
zpm-sync = { workspace = true }
zpm-tasks = { workspace = true }
zpm-utils = { workspace = true }
brotli = { workspace = true }
env_logger = { workspace = true }
hickory-resolver = { workspace = true }
indexmap = { workspace = true, features = ["serde"]}
interprocess = { workspace = true, features = ["tokio"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
hex = { workspace = true }
p256 = { workspace = true }
spki = { workspace = true }
ring = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
uuid = { version = "1.21.0", features = ["v4"] }
async-trait = "0.1.89"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_arch = "wasm64", target_vendor = "browserpod"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["default-tls"] }

[target.'cfg(not(all(target_arch = "wasm64", target_vendor = "browserpod")))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }

[build-dependencies]
flate2 = { workspace = true }

[dev-dependencies]
divan = { workspace = true, package = "codspeed-divan-compat" }

[[bench]]
name = "cli"
harness = false
