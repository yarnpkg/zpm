name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'documentation/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'documentation/**'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: wasm32-browserpod-linux-musl
            os: ubuntu-latest

    name: "Building ${{matrix.target}}"
    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - uses: ./.github/actions/build
        id: build
        with:
          target: ${{matrix.target}}
          profile: release-lto-nodebug

      - name: "Build ${{steps.build.outputs.version}}"
        run: |
          # The binary was already built in the previous step but we must have a step
          # named exactly "Build <version>" to allow the Cloudflare workers to detect
          # the version of the commit.

      - name: "Generate an iso image for v86"
        if: matrix.target == 'i686-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install genisoimage
          cd target/${{matrix.target}}/release-lto-nodebug/
          genisoimage -R -o yarn.iso {yarn,yarn-bin}

      - name: Upload artifacts
        if: matrix.target != 'wasm32-browserpod-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yarn-${{matrix.target}}
          path: |
            target/${{matrix.target}}/release-lto-nodebug/yarn-bin${{matrix.ext}}
            target/${{matrix.target}}/release-lto-nodebug/yarn${{matrix.ext}}
            target/${{matrix.target}}/release-lto-nodebug/LICENSE.md

      - name: Upload Browserpod artifacts
        if: matrix.target == 'wasm32-browserpod-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yarn-${{matrix.target}}
          path: |
            target/${{matrix.target}}/release-lto-nodebug/yarn-bin.wasm
            target/${{matrix.target}}/release-lto-nodebug/LICENSE.md

      - name: Upload iso image
        if: matrix.target == 'i686-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yarn-${{matrix.target}}-iso
          path: target/${{matrix.target}}/release-lto-nodebug/yarn.iso

  test:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            # The lockfile can't list the Windows builds of the builtin Node.js
            # yet, as the Yarn release we pin doesn't know about them
            install-args: --refresh-lockfile
            timeout: 60

    name: "Testing ${{matrix.target}}"
    needs: [build]
    runs-on: ${{matrix.os}}
    timeout-minutes: ${{matrix.timeout || 360}}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yarn-${{matrix.target}}
          path: artifacts

      - name: Prepare Node
        uses: ./.github/actions/prepare-node
        with:
          link: artifacts/yarn-bin${{matrix.ext}}
          switch: artifacts/yarn${{matrix.ext}}
          install-args: ${{matrix.install-args}}

      - name: Generate the test report
        run: |
          chmod +x artifacts/{yarn,yarn-bin}${{matrix.ext}}

          # Git Bash reports POSIX paths, but the tests need native ones
          root=$(pwd -W 2>/dev/null || pwd)

          export TEST_BINARY=$root/artifacts/yarn-bin${{matrix.ext}}
          export TEST_SWITCH_BINARY=$root/artifacts/yarn${{matrix.ext}}

          yarn ./tests/acceptance-tests jest --json --outputFile=$root/report.json || true

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yarn-${{matrix.target}}-test-report
          path: report.json

  report:
    name: Reporting test results
    needs: [test]
    runs-on: ubuntu-latest

    environment:
      name: test-reports
      url: >-
        ${{
          github.event_name == 'pull_request' &&
          format('https://iteratum.ai/examples/jest-ui/?url=https%3A%2F%2Frepo.yarnpkg.com%2Fbuilds%2Fzpm%2Fcommits%2F{0}%2Ftests&compareUrl=https%3A%2F%2Frepo.yarnpkg.com%2Fbuilds%2Fzpm%2Fcommits%2F{1}%2Ftests', github.event.pull_request.head.sha, steps.fork-point.outputs.result) ||
          format('https://iteratum.ai/examples/jest-ui/?url=https%3A%2F%2Frepo.yarnpkg.com%2Fbuilds%2Fzpm%2Fcommits%2F{0}%2Ftests', github.sha)
        }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - name: Retrieve the fork point for the pull request
        id: fork-point
        if: github.event_name == 'pull_request'
        run: |
          echo "result=$(git merge-base ${{github.event.pull_request.base.sha}} ${{github.event.pull_request.head.sha}})" >> $GITHUB_OUTPUT
