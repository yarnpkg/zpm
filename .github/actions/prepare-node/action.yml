name: Prepare Node
description: 'Prepares the Node environment for the repository'

inputs:
  link:
    description: 'The link to the local path'
    required: false
  switch:
    description: 'Path to a locally built yarn-switch binary to use in place of the released one'
    required: false

runs:
  using: composite
  steps:
    - uses: yarnpkg/setup-action@main
      if: inputs.switch == ''

    - name: Install the provided Yarn Switch binary
      if: inputs.switch != ''
      shell: bash
      run: |
        set -euo pipefail
        chmod +x "${{inputs.switch}}"
        install_dir="${RUNNER_TEMP}/yarn-switch-bin"
        mkdir -p "${install_dir}"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          cp -f "${{inputs.switch}}" "${install_dir}/yarn.exe"
        else
          cp -f "${{inputs.switch}}" "${install_dir}/yarn"
        fi
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Add link to the local path
      if: inputs.link != ''
      shell: bash
      run: |
        chmod +x ${{inputs.link}}
        yarn switch link ${{inputs.link}}

    - name: Install pnpm
      shell: bash
      run: |
        npm install --global pnpm@10

    - name: Install dependencies
      shell: bash
      run: |
        yarn install
